# Reusable deploy of one environment, called by deploy-staging.yaml and deploy-production.yaml.
#   1. full image scan of BOTH digests named in environments/<env>/*/image.env, with a fresh vulnerability DB
#   2. deploy over SSH: the server's deploy gate (scripts/deploy-gate.sh, the key's forced command) checks out
#      exactly this infra commit, if it is on main, and runs scripts/deploy.sh, pulling the private GHCR images
#      with this job's short-lived GITHUB_TOKEN (the server stores no registry credential)
# Job 2 runs in the GitHub environment <env> (its secrets VPS_HOST, VPS_USERNAME, VPS_SSH_KEY resolve there,
# which only works because the callers use `secrets: inherit`); production waits for a required reviewer.
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      scan_policy:
        description: enforce (block on fixable HIGH/CRITICAL) or report (rollback to an older image)
        required: false
        type: string
        default: enforce

permissions: {}

jobs:
  image-scan:
    name: Pre-deploy image scan (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    outputs:
      ready: ${{ steps.images.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: images
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ready=true
          for app in backend frontend; do
            upper="$(echo "$app" | tr '[:lower:]' '[:upper:]')"
            file="environments/$TARGET/$app/image.env"
            image="$(sed -n "s/^${upper}_IMAGE=//p" "$file")"
            digest="$(sed -n "s/^${upper}_DIGEST=//p" "$file")"
            if [ -z "$digest" ]; then
              echo "::notice::$app has no published image for $TARGET yet: nothing to deploy"
              ready=false
            fi
            echo "${app}_ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.images.outputs.ready == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan backend
        if: steps.images.outputs.ready == 'true'
        env:
          REF: ${{ steps.images.outputs.backend_ref }}
          POLICY: ${{ inputs.scan_policy }}
        run: scripts/ci/scan-image.sh "$REF" sarif/backend.sarif "$POLICY"
      - name: Scan frontend
        if: steps.images.outputs.ready == 'true'
        env:
          REF: ${{ steps.images.outputs.frontend_ref }}
          POLICY: ${{ inputs.scan_policy }}
        run: scripts/ci/scan-image.sh "$REF" sarif/frontend.sarif "$POLICY"
      - if: always() && hashFiles('sarif/backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/backend.sarif
          category: predeploy-${{ inputs.environment }}-backend
      - if: always() && hashFiles('sarif/frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/frontend.sarif
          category: predeploy-${{ inputs.environment }}-frontend

  deploy:
    name: Deploy ${{ inputs.environment }}
    needs: image-scan
    if: needs.image-scan.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    # packages: read = this job's GITHUB_TOKEN can pull the private GHCR images. It is handed to the server for
    # this deploy only and expires when the job ends, so no registry credential is ever stored there.
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.environment }}
    # One deploy per environment at a time; a newer one waits, nothing is ever cancelled half-way.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] && [ -n "$HOST" ] && [ -n "$HOST_KEY" ] || {
            echo "::error::environment secrets VPS_SSH_KEY, VPS_HOST and variable VPS_HOST_KEY are required (docs/deployment.md)"; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
      - name: scripts/deploy.sh on the server
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USERNAME: ${{ secrets.VPS_USERNAME }}
          TARGET: ${{ inputs.environment }}
          SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The deploy key is pinned to the server's deploy gate (scripts/deploy-gate.sh): this request line is
          # all it accepts. The token travels as the only line of stdin, never on a command line.
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
              "${USERNAME:-deploy}@$HOST" "deploy $TARGET $SHA $GHCR_USER"
      - if: always()
        run: rm -f ~/.ssh/id_deploy

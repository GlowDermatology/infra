# Validate the infra and scan both pinned images before the caller's environment-bound SSH job.
name: Prepare deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      scan_policy:
        description: enforce (block on fixable HIGH/CRITICAL) or report (rollback to an older image)
        required: false
        type: string
        default: enforce
    outputs:
      ready:
        description: Both application image references for this target are published
        value: ${{ jobs.image-scan.outputs.ready }}

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/validate.yaml

  image-scan:
    name: Pre-deploy image scan (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    outputs:
      ready: ${{ steps.images.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: images
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          ready=true
          for app in backend frontend; do
            upper="$(echo "$app" | tr '[:lower:]' '[:upper:]')"
            file="environments/$TARGET/$app/image.env"
            image="$(sed -n "s/^${upper}_IMAGE=//p" "$file")"
            digest="$(sed -n "s/^${upper}_DIGEST=//p" "$file")"
            if [ -z "$digest" ]; then
              echo "::notice::$app has no published image for $TARGET yet: nothing to deploy"
              ready=false
            fi
            echo "${app}_ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - if: steps.images.outputs.ready == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan backend
        if: steps.images.outputs.ready == 'true'
        env:
          REF: ${{ steps.images.outputs.backend_ref }}
          POLICY: ${{ inputs.scan_policy }}
        run: scripts/ci/scan-image.sh "$REF" sarif/backend.sarif "$POLICY"
      - name: Scan frontend
        if: steps.images.outputs.ready == 'true'
        env:
          REF: ${{ steps.images.outputs.frontend_ref }}
          POLICY: ${{ inputs.scan_policy }}
        run: scripts/ci/scan-image.sh "$REF" sarif/frontend.sarif "$POLICY"
      - if: always() && hashFiles('sarif/backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/backend.sarif
          category: predeploy-${{ inputs.environment }}-backend
      - if: always() && hashFiles('sarif/frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sarif/frontend.sarif
          category: predeploy-${{ inputs.environment }}-frontend

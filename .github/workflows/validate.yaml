# Static checks of the infra repository on every push and pull request. Nothing here touches a server.
name: Validate

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Compose, Caddy, Vault, scripts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Caddy and Vault binaries from the pinned images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for spec in "caddy:2.11.8-alpine@sha256:3db3a09e418f86a8fce8de4bc0026fccd2b4cd925aef00cc7d843d9fdc75e442 /usr/bin/caddy" \
                      "hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2 /bin/vault"; do
            read -r image path <<<"$spec"
            id="$(docker create "$image")"
            docker cp "$id:$path" "$RUNNER_TEMP/bin/"
            docker rm "$id" >/dev/null
          done
      - name: scripts/validate.sh (compose for both envs, structural rules, Caddy validate + edge probe, shellcheck)
        run: CADDY_BIN="$RUNNER_TEMP/bin/caddy" scripts/validate.sh
      - name: Vault end to end (policies, negative authorization, real agents rendering every template)
        # As root: configure.sh writes the AppRole files owned by the agents' UIDs, exactly as on a server.
        run: sudo --preserve-env=PATH VAULT_BIN="$RUNNER_TEMP/bin/vault" scripts/ci/test-vault.sh

  security-gitleaks:
    name: Secrets in history (gitleaks)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --verbose --exit-code 1 /repo

  security-workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f -color
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uvx zizmor@1.32.0 --offline --min-severity medium .github/workflows

  security-sast:
    name: SAST and misconfiguration (semgrep, trivy config)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
          semgrep scan --metrics=off --error --severity ERROR
          --config p/default --config p/command-injection --config p/github-actions --config p/secrets --config p/python
          --sarif --sarif-output=semgrep.sarif
      - name: trivy config + secret scan of the repository
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          fs --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

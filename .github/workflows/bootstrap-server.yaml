# Prepare a fresh Ubuntu 24.04 / 26.04 server for one environment (scripts/bootstrap-server.sh). Idempotent.
#
# Inputs: the environment and the server's SSH host key, which you obtain OUT OF BAND (provider console, or
# ssh-keyscan -t ed25519 <host> from your own machine, compared with the console). It is never trusted on first
# use. After the run, store the same value as the environment variable VPS_HOST_KEY for the deploy workflows.
#
# The provider must have installed the public half of VPS_SSH_KEY for VPS_BOOTSTRAP_USER (root, or a user
# with passwordless sudo). Production requires an approval like any production job.
name: Bootstrap server

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
      host_key:
        description: 'Server host key, e.g. "ssh-ed25519 AAAAC3Nza..." (verified out of band)'
        type: string
        required: true

permissions: {}

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run scripts/bootstrap-server.sh over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          HOST_KEY: ${{ inputs.host_key }}
          BOOT_USER: ${{ vars.VPS_BOOTSTRAP_USER }}
          TARGET: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          [[ "$HOST_KEY" =~ ^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa)\ [A-Za-z0-9+/=]+$ ]] ||
            { echo "::error::host_key must look like 'ssh-ed25519 AAAA...'"; exit 1; }
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 0600 ~/.ssh/id_deploy
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts
          pub="$(ssh-keygen -y -f ~/.ssh/id_deploy)"
          user="${BOOT_USER:-root}"
          sudo=""; [ "$user" = root ] || sudo="sudo -n"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes "$user@$HOST" \
            "$sudo env DEPLOY_PUBLIC_KEY='$pub' bash -s -- $TARGET" < scripts/bootstrap-server.sh
          rm -f ~/.ssh/id_deploy
          echo "::notice::Bootstrapped. Set variable VPS_HOST_KEY of environment '$TARGET' to the host key you entered, then follow docs/first-server-runbook.md."
